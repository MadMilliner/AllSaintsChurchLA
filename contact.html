<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <title>All Saints Church LA Contact</title>
        <link rel="icon" type="image/x-icon" href="/images/favicon.ico">
        <meta name="description" content="">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link rel="stylesheet" href="style.css">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
    </head>
    <body>
        <div id="nav-header">
        </div>
        <div id="contactPage">
            <h4>We would love to hear from you</h4>
            <form action="contact_email.php" autocomplete="on" method="post" class="contact-form">
                <fieldset class="name-fields">
                    <div>
                    <label for="first-name">First Name <span>(required)</span></label>
                    <input type="text" id="first-name" name="first-name" aria-required="true" aria-describedby="first-name-error">
                    </div>
                    <div>
                    <label for="last-name">Last Name</label>
                    <input type="text" id="last-name" name="last-name">
                    </div>
                </fieldset>

                <label for="email">Email <span>(required)</span></label>
                <input type="email" id="email" name="email" aria-required="true">

                <label for="message">Message <span>(required)</span></label>
                <textarea id="message" name="message" rows="5" aria-required="true"></textarea>

                <button type="submit">Send Message</button>
            </form>
            <div id="signup"></div>
        </div>
        
        <div id="footer">
            
        </div>
        <script src="script.js" type="module" defer></script>
    </body>
</html>
